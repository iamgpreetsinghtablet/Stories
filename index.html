<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic AI Stories | Children's Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --dark: #2d3436;
            --light: #f9f9f9;
            --white: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--light); 
            color: var(--dark);
            line-height: 1.6;
        }
        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            padding: 80px 20px;
            text-align: center;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0% 100%);
        }
        .header h1 { font-size: 3.5rem; font-weight: 800; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .header p { font-size: 1.2rem; opacity: 0.9; }
        
        .container {
            max-width: 1200px;
            margin: -50px auto 60px;
            padding: 0 20px;
        }
        
        .story-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }
        
        .story-card {
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }
        
        .story-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(108, 92, 231, 0.2);
        }
        
        .story-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 5px solid var(--secondary);
        }
        
        .story-content {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .story-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--dark);
        }
        
        .read-btn {
            display: inline-block;
            margin-top: 15px;
            color: var(--primary);
            font-weight: 600;
            display: flex;
            align-items: center;
        }
        
        .read-btn::after {
            content: '→';
            margin-left: 8px;
            transition: margin-left 0.2s;
        }
        
        .story-card:hover .read-btn::after {
            margin-left: 12px;
        }
        
        footer {
            text-align: center;
            padding: 40px;
            color: #777;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2.5rem; }
            .container { margin-top: 20px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>📚 My Magic Library</h1>
        <p>Enchanting children's stories created by AI</p>
    </header>

    <div class="container">
        <div class="story-grid">

        </div>
    </div>

    <footer>
        <p>&copy; 2026 Magic AI Stories. Created with 🪄 and AI.</p>
    </footer>
</body>
</html>
